<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<style>
  :root {
    --bg: #07060f;
    --panel: #0d0b1c;
    --cyan: #00f0ff;
    --pink: #ff2bd6;
    --lime: #b6ff3b;
    --text: #e8e6ff;
    --muted: #8a86b8;
    --border: #2a2550;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(255,43,214,.18), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, rgba(0,240,255,.18), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: min(100%, 880px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--cyan);
    border-radius: 18px;
    box-shadow: 0 0 12px rgba(0,240,255,.55), 0 0 40px rgba(0,240,255,.25), inset 0 0 30px rgba(255,43,214,.08);
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 8px var(--lime), 0 0 18px var(--lime);
    flex: none;
  }
  h1 {
    font-size: 1.25rem;
    letter-spacing: .04em;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan), 0 0 22px rgba(0,240,255,.6);
    white-space: nowrap;
  }
  .tools { display: flex; gap: 8px; }
  .tools button {
    background: transparent;
    color: var(--pink);
    border: 1px solid var(--pink);
    border-radius: 10px;
    padding: 7px 12px;
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,43,214,.4);
    transition: background .15s, color .15s;
  }
  .tools button:hover { background: var(--pink); color: #12020f; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: .98rem;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    border: 1px solid var(--pink);
    color: #ffe6fa;
    background: rgba(255,43,214,.1);
    box-shadow: 0 0 10px rgba(255,43,214,.45);
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    border: 1px solid var(--cyan);
    background: rgba(0,240,255,.07);
    box-shadow: 0 0 10px rgba(0,240,255,.35);
    border-bottom-left-radius: 4px;
  }
  .row.error .bubble {
    border: 1px solid #ff4d5e;
    background: rgba(255,77,94,.1);
    color: #ffc9ce;
    box-shadow: 0 0 10px rgba(255,77,94,.4);
  }
  .bubble pre {
    background: #05040c;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 8px 0;
    overflow-x: auto;
    white-space: pre;
    font-family: Consolas, "Courier New", monospace;
    font-size: .88rem;
    color: var(--lime);
  }
  .bubble code {
    font-family: Consolas, "Courier New", monospace;
    background: rgba(182,255,59,.1);
    color: var(--lime);
    padding: 1px 5px;
    border-radius: 5px;
    font-size: .9em;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble strong { color: var(--cyan); }
  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.1); } }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 360px;
    line-height: 1.6;
  }
  .empty b {
    display: block;
    font-size: 1.5rem;
    color: var(--pink);
    text-shadow: 0 0 10px var(--pink), 0 0 26px rgba(255,43,214,.6);
    margin-bottom: 6px;
  }
  .composer {
    display: flex;
    gap: 10px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    min-height: 46px;
    background: #090817;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font: inherit;
    line-height: 1.4;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus { border-color: var(--lime); box-shadow: 0 0 10px rgba(182,255,59,.45); }
  #send {
    height: 46px;
    padding: 0 22px;
    border-radius: 12px;
    border: 1px solid var(--lime);
    background: transparent;
    color: var(--lime);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    text-shadow: 0 0 8px var(--lime);
    box-shadow: 0 0 10px rgba(182,255,59,.45);
    transition: background .15s, color .15s;
  }
  #send:hover:not(:disabled) { background: var(--lime); color: #0b1400; text-shadow: none; }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  @media (max-width: 520px) {
    body { padding: 0; }
    .app { border-radius: 0; height: 100%; }
    .bubble { max-width: 92%; }
    h1 { font-size: 1.05rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing span { animation: none; opacity: 1; }
    #messages { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span></div>
    <div class="tools">
      <button id="keyBtn" type="button">API key</button>
      <button id="clearBtn" type="button">Clear chat</button>
    </div>
  </header>

  <div id="messages" aria-live="polite"></div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Type your message and press Enter" aria-label="Message"></textarea>
    <button id="send" type="button">Send</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Default key. You can change it any time with the "API key" button.
  var DEFAULT_KEY = "AQ.Ab8RN6Jeyijt4xH53ZfWVs6X9B7uYTPMnbMU_gL8obDe-2hmWg";
  var MODEL = "gemini-3.8-flash";
  var ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent";

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var keyBtn = document.getElementById("keyBtn");
  var clearBtn = document.getElementById("clearBtn");

  var history = [];
  var busy = false;

  function getKey() {
    try {
      var saved = localStorage.getItem("neon_ai_key");
      if (saved) return saved;
    } catch (e) {}
    return DEFAULT_KEY;
  }

  function setKey(k) {
    try { localStorage.setItem("neon_ai_key", k); } catch (e) {}
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Safe, minimal formatting: code blocks, inline code, bold.
  function format(text) {
    var safe = escapeHtml(text);
    safe = safe.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, function (_, code) {
      return "<pre><code>" + code.replace(/\n$/, "") + "</code></pre>";
    });
    safe = safe.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    safe = safe.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    return safe;
  }

  function showEmpty() {
    messagesEl.innerHTML =
      '<div class="empty" id="empty"><b>Hello there</b>Ask me anything. Your chat appears here.</div>';
  }

  function removeEmpty() {
    var e = document.getElementById("empty");
    if (e) e.remove();
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(kind, text) {
    removeEmpty();
    var row = document.createElement("div");
    row.className = "row " + kind;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (kind === "user") bubble.textContent = text;
    else bubble.innerHTML = format(text);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollDown();
    return row;
  }

  function addTyping() {
    removeEmpty();
    var row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    scrollDown();
    return row;
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
  }

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  }

  function friendlyError(status, data) {
    var msg = data && data.error && data.error.message ? data.error.message : "";
    if (status === 400 && /API key/i.test(msg)) return "The API key is not valid. Click \"API key\" and enter a new one.";
    if (status === 401 || status === 403) return "Access denied. Check that the API key is correct and the Gemini API is enabled for it.";
    if (status === 429) return "Too many requests. Wait a moment and try again.";
    if (status >= 500) return "The AI service is having trouble. Try again in a moment.";
    return msg || ("Request failed (status " + status + ").");
  }

  async function send() {
    if (busy) return;
    var text = inputEl.value.trim();
    if (!text) return;

    var key = getKey();
    if (!key) {
      addMessage("error", "No API key set. Click \"API key\" to add one.");
      return;
    }

    addMessage("user", text);
    inputEl.value = "";
    autoGrow();
    history.push({ role: "user", parts: [{ text: text }] });

    setBusy(true);
    var typing = addTyping();

    try {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 45000);
      var res;
      try {
        res = await fetch(ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": key
          },
          body: JSON.stringify({ contents: history }),
          signal: controller.signal
        });
      } catch (e) {
        clearTimeout(timer);
        if (e && e.name === "AbortError") {
          typing.remove();
          history.pop();
          addMessage("error", "No reply after 45 seconds. The model may be unavailable for this key. Try again, or change MODEL in the file to another model name.");
          return;
        }
        throw e;
      }

      var data = null;
      try { data = await res.json(); } catch (e) {}
      clearTimeout(timer);

      typing.remove();

      if (!res.ok) {
        history.pop();
        addMessage("error", friendlyError(res.status, data));
        return;
      }

      var reply = "";
      var cand = data && data.candidates && data.candidates[0];
      if (cand && cand.content && cand.content.parts) {
        reply = cand.content.parts.map(function (p) { return p.text || ""; }).join("");
      }

      if (!reply) {
        history.pop();
        var why = data && data.promptFeedback && data.promptFeedback.blockReason;
        addMessage("error", why ? "The message was blocked (" + why + "). Try rephrasing." : "The AI returned an empty reply. Try again.");
        return;
      }

      history.push({ role: "model", parts: [{ text: reply }] });
      addMessage("bot", reply);
    } catch (err) {
      typing.remove();
      history.pop();
      var detail = (err && (err.name + ": " + err.message)) || "unknown";
      addMessage("error", "Could not reach the AI service.\nDetail: " + detail + "\nPage address: " + location.href.slice(0, 60) + "\nOpen this file directly in Chrome or Edge, turn off ad blockers or VPN, and try again.");
    } finally {
      setBusy(false);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener("input", autoGrow);

  keyBtn.addEventListener("click", function () {
    var k = window.prompt("Paste your Gemini API key:", "");
    if (k && k.trim()) {
      setKey(k.trim());
      addMessage("bot", "API key saved.");
    }
  });

  clearBtn.addEventListener("click", function () {
    history = [];
    showEmpty();
  });

  showEmpty();
  inputEl.focus();
})();
</script>
</body>
</html>
