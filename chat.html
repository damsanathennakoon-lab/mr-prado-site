
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Prado AI Chat</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080d18;
  color:#f1f5f9;
  min-height:100vh;
  display:flex;
  flex-direction:column
}
header{
  padding:18px;
  background:#101a2b;
  border-bottom:1px solid #263750;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.logo{font-size:21px;font-weight:bold;color:#60a5fa}
a{color:#93c5fd;text-decoration:none}
main{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:20px;
  flex:1;
  display:flex;
  flex-direction:column
}
h1{text-align:center;font-size:28px}
.subtitle{text-align:center;color:#9caec5}
#chat{
  flex:1;
  min-height:300px;
  max-height:60vh;
  overflow-y:auto;
  padding:10px 0
}
.msg{
  padding:13px 16px;
  margin:12px 0;
  border-radius:15px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.user{background:#17345b;margin-left:12%;border:1px solid #28518a}
.bot{background:#111c2d;margin-right:12%;border:1px solid #273951}
form{display:flex;gap:10px;margin-top:15px}
textarea{
  flex:1;resize:vertical;min-height:52px;max-height:140px;
  background:#111c2d;color:white;border:1px solid #334155;
  border-radius:12px;padding:15px;font-size:16px
}
button{
  background:#2563eb;color:white;border:0;border-radius:12px;
  padding:0 20px;font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.note{text-align:center;color:#8494aa;font-size:12px;margin:15px}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ Mr Prado AI</div>
  <a href="index.html">← Home</a>
</header>

<main>
  <h1>AI Assistant</h1>
  <p class="subtitle">Welcome to Mr Prado AI Chat</p>

  <div id="chat" aria-live="polite">
    <div class="msg bot">Hello! 👋 Welcome to Mr Prado AI. Send a message to get started.</div>
  </div>

  <form id="form">
    <textarea id="message" maxlength="2000"
      placeholder="Type your message..." required></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <p class="note">AI responses may contain mistakes. Please verify important information.</p>
</main>

<script>
const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const send = document.getElementById("send");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;

  addMessage(message, "user");
  input.value = "";
  send.disabled = true;
  addMessage("ChatGPT API backend එක සම්බන්ධ කළ පසු මෙතැනින් පිළිතුරු ලැබේ.", "bot");

  send.disabled = false;
});
</script>
</body>
</html>
