<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API test</title>
<style>
  body { margin:0; padding:16px; font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px;
         background:#fff; color:#111827; }
  @media (prefers-color-scheme:dark){ body{background:#0f1115;color:#f3f4f6;} }
  .w { max-width:760px; margin:0 auto; }
  label { display:block; font-size:12px; color:#6b7280; margin:10px 0 4px; }
  input { width:100%; padding:8px; border-radius:8px; border:1px solid #9ca3af;
          background:transparent; color:inherit; font-family:inherit; }
  button { margin-top:12px; padding:10px 18px; border-radius:8px; border:0; background:#2563eb;
           color:#fff; font-size:14px; font-weight:500; }
  pre { margin-top:14px; padding:12px; border-radius:8px; background:#f3f4f6; color:#111827;
        font-size:12px; white-space:pre-wrap; word-break:break-word; min-height:80px; }
  @media (prefers-color-scheme:dark){ pre{background:#1f242e;color:#f3f4f6;} }
</style>
</head>
<body>
<div class="w">
  <h2>OpenAI API test</h2>
  <label>API key</label>
  <input id="key" type="password" value="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">
  <label>Proxy prefix (optional)</label>
  <input id="proxy" placeholder="https://xxx.workers.dev/?url=">
  <button id="go">Run test</button>
  <pre id="out">press "Run test"</pre>
</div>
<script>
const BASE = 'https://api.openai.com/v1';
const out = document.getElementById('out');
const say = s => { out.textContent += s + '\n'; };
const u = p => { const x = document.getElementById('proxy').value.trim();
  return x ? x + encodeURIComponent(BASE + p) : BASE + p; };

document.getElementById('go').onclick = async () => {
  out.textContent = '';
  const key = document.getElementById('key').value.trim();
  say('origin: ' + location.origin);
  say('agent : ' + navigator.userAgent.slice(0, 90));
  say('online: ' + navigator.onLine + '   proxy: ' + (document.getElementById('proxy').value.trim() || 'none'));
  say('-----------------------------------------');

  // 1) pure reachability, no CORS needed
  const t1 = Date.now();
  try {
    await fetch('https://api.openai.com/v1/models', { mode: 'no-cors', cache: 'no-store' });
    say('[1] reachable ......... PASS  (' + (Date.now() - t1) + 'ms)');
  } catch (e) {
    say('[1] reachable ......... FAIL  (' + (Date.now() - t1) + 'ms)  ' + e.message);
    say('    => DNS / firewall / ad blocker / VPN ප්‍රශ්නයක්. API key එක ගැන ප්‍රශ්නයක් නෙවෙයි.');
    return;
  }

  // 2) CORS + key
  try {
    const r = await fetch(u('/models'), { headers: { Authorization: 'Bearer ' + key }, cache: 'no-store' });
    const t = await r.text();
    say('[2] CORS + key ........ HTTP ' + r.status);
    if (!r.ok) { say('    body: ' + t.slice(0, 250)); say('    => CORS එක OK, key/quota එකේ ප්‍රශ්නයක්.'); return; }
    let n = 0; try { n = (JSON.parse(t).data || []).length; } catch (e) {}
    say('    => PASS, models: ' + n);
  } catch (e) {
    say('[2] CORS + key ........ FAIL  ' + e.message);
    say('    => CORS/preflight block. Proxy prefix එකක් දාලා ආයෙත් run කරන්න.');
    return;
  }

  // 3) non-streaming chat
  try {
    const r = await fetch(u('/chat/completions'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({ model: 'gpt-4o-mini', messages: [{ role: 'user', content: 'Say OK' }] })
    });
    const j = await r.json();
    say('[3] normal chat ....... HTTP ' + r.status + '  -> ' +
        (j.choices ? JSON.stringify(j.choices[0].message.content) : JSON.stringify(j).slice(0, 250)));
  } catch (e) { say('[3] normal chat ....... FAIL  ' + e.message); }

  // 4) streaming chat (raw SSE)
  try {
    const r = await fetch(u('/chat/completions'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({ model: 'gpt-4o-mini', messages: [{ role: 'user', content: 'Count 1 to 5' }], stream: true })
    });
    const rd = r.body.getReader(); const dc = new TextDecoder(); let raw = '';
    while (raw.length < 400) { const x = await rd.read(); if (x.done) break; raw += dc.decode(x.value); }
    rd.cancel();
    say('[4] streaming ......... HTTP ' + r.status + '  first bytes: ' + JSON.stringify(raw.slice(0, 200)));
  } catch (e) { say('[4] streaming ......... FAIL  ' + e.message); }

  say('-----------------------------------------');
  say('හැම step එකක්ම PASS නම් chat.html එකේ streaming bug එක විතරයි ඉතුරු.');
};
</script>
</body>
</html>
